name: Australian Retirement Trust

description: 'Australian Retirement Trust (ART, ABN 60 905 115 063) is an Australian superannuation fund that says
  it puts its 2.4 million members first with long-term investment performance, lower fees and retirement support.
  It offers super and retirement products, financial advice, the Member Online portal and the ART mobile app,
  and it also administers QSuper accounts. Its public website (art.com.au redirects to australianretirementtrust.com.au)
  publishes no developer portal or public API documentation. The profile was surfaced via the API Evangelist
  harvest backlog (source: australia-apidays-2026).'

